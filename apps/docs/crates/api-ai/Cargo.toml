[package]
name = "niho-api-ai"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
license = "UNLICENSED"
description = "NIHO docs: API キー方式の AI（Anthropic Messages・OpenAI Responses・Gemini generateContent）と文字起こし（Gemini Files・Deepgram）を Tauri に依存せず呼ぶ"

[lib]
name = "niho_api_ai"
path = "src/lib.rs"

# 依存はどれも apps/docs の Cargo.lock に既にある版（tauri-plugin-updater の reqwest・rustls〔ring〕・tokio）。新しい crate は増やさない。
# reqwest は既定の機能を切り、rustls（暗号は ring。updater と同じ）・ファイルを流す body（stream）だけを使う。
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["rt", "time", "net", "sync", "fs"] }
