[package]
# package 名はハイフン（Tauri の plugin 名になる。tauri-plugin の build は `_` を含む名前を拒む）。Rust から使う名前は
# `[lib]` の `niho_desktop_account`。
name = "niho-desktop-account"
version = "0.1.0"
description = "NIHO アカウントでログイン（NIHO camera・NIHO docs の共通モジュール）。PKCE・一度きりのコードの交換・接続 refresh token の保持と更新・アカウントの状態。specs/initiatives/niho-account-desktop-login.md"
authors = ["NIHO"]
license = "UNLICENSED"
repository = "https://github.com/niho-coliving/niho-clients"
edition = "2021"
rust-version = "1.85"
publish = false
# tauri-plugin の build（permissions/ の生成）が要求する。値は package 名と同じ。
links = "niho-desktop-account"
build = "build.rs"

[lib]
name = "niho_desktop_account"
path = "src/lib.rs"

[features]
default = ["reqwest"]
# 本番の HttpClient（reqwest・rustls〔ring〕・OS の信頼する CA〔rustls-platform-verifier〕）。アプリは既定で使う。
reqwest = ["dep:reqwest", "dep:rustls"]
# Tauri の層（plugin・commands・event・deep link の受け口・既定のブラウザ）。アプリだけが有効にする。
tauri = ["reqwest", "dep:tauri", "dep:tauri-plugin-deep-link", "dep:tauri-plugin-opener", "dep:tauri-plugin"]
# テストの道具（偽の HttpClient・メモリの SecretStore・偽の時計）を公開する。アプリの dev-dependencies だけが使う。
test-support = []

# コアは Tauri に依存しない。どれも NIHO camera / NIHO docs の Cargo.lock に既にある版。
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
url = { version = "2.5", features = ["serde"] }
tokio = { version = "1", features = ["sync", "time", "rt"] }
# reqwest は既定の機能を切り、rustls（暗号は ring。apps/docs の niho-api-ai と同じ）と OS の信頼する CA だけを使う。
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }
tauri = { version = "2", optional = true }
tauri-plugin-deep-link = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }

# 接続 refresh token と pending は macOS Keychain の generic password（apps/docs の secrets.rs と同じ crate・同じ呼び出し）。
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["sync", "time", "rt", "rt-multi-thread", "macros"] }
